<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc">
  <title id="title">Trilha de aprendizado Campus Backend</title>
  <desc id="desc">Roadmap vertical dos módulos de JavaScript Backend. Módulos 1 a 5 concluídos, módulo 6 em revisão e módulo 7, Funções, como foco atual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a27"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#314158" opacity=".34"/>
    </pattern>
  </defs>
  <style>
    .mobile { display: none; }
    @media (max-width: 480px) {
      .desktop { display: none; }
      .mobile { display: inline; }
    }
  </style>

  <rect width="720" height="800" rx="24" fill="url(#bg)"/>
  <rect width="720" height="800" rx="24" fill="url(#grid)"/>

  <g class="desktop" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="48" y="55" fill="#79c0ff" font-size="12" font-weight="800" letter-spacing="2">TRILHA DE APRENDIZADO</text>
    <text x="48" y="96" fill="#f0f6fc" font-size="30" font-weight="800">Do fundamento ao Backend.</text>
    <text x="48" y="126" fill="#b1bac4" font-size="15">Progresso organizado por domínio, prática e próximo objetivo.</text>

    <path d="M102 177V739" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    <path d="M102 177V425" stroke="#2f81f7" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(102 188)">
      <circle r="24" fill="#0d2c1a" stroke="#3fb950" stroke-width="3"/>
      <path d="m-9 0 6 7L11-8" fill="none" stroke="#56d364" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="-5" fill="#56d364" font-size="12" font-weight="800" letter-spacing="1.3">CONCLUÍDO · M01–M05</text>
      <text x="48" y="24" fill="#f0f6fc" font-size="22" font-weight="800">Fundamentos</text>
      <text x="48" y="49" fill="#b1bac4" font-size="15">Variáveis, condicionais, operadores e entrada de dados.</text>
    </g>

    <g transform="translate(102 304)">
      <circle r="24" fill="#102a4c" stroke="#2f81f7" stroke-width="3"/>
      <path d="M-9 0A10 10 0 1 1 0 9" fill="none" stroke="#79c0ff" stroke-width="3" stroke-linecap="round"/>
      <path d="m-2 4 3 6-7 1" fill="#79c0ff"/>
      <text x="48" y="-5" fill="#79c0ff" font-size="12" font-weight="800" letter-spacing="1.3">REVISÃO · M06</text>
      <text x="48" y="24" fill="#f0f6fc" font-size="22" font-weight="800">Controle de fluxo</text>
      <text x="48" y="49" fill="#b1bac4" font-size="15">Laços de repetição e consolidação da lógica.</text>
    </g>

    <g transform="translate(48 386)">
      <rect width="624" height="142" rx="18" fill="#201c08" stroke="#f2cc60" stroke-width="2"/>
      <rect x="20" y="20" width="84" height="30" rx="15" fill="#3a3000"/>
      <text x="38" y="40" fill="#f2cc60" font-size="12" font-weight="800" letter-spacing="1.1">FOCO ATUAL</text>
      <text x="20" y="86" fill="#f0f6fc" font-size="28" font-weight="800">M07 · Funções</text>
      <text x="20" y="113" fill="#d4c989" font-size="15">Parâmetros, retorno, escopo e composição.</text>
      <circle cx="553" cy="71" r="39" fill="#0d1117" stroke="#6e5b00" stroke-width="7"/>
      <path d="M553 32A39 39 0 1 1 523 96" fill="none" stroke="#f2cc60" stroke-width="7" stroke-linecap="round"/>
      <text x="553" y="76" text-anchor="middle" fill="#f2cc60" font-size="18" font-weight="800">64%</text>
    </g>

    <g transform="translate(102 600)">
      <circle r="24" fill="#161b22" stroke="#484f58" stroke-width="3"/>
      <path d="M-8 1h16M0-7v16" stroke="#8c98a5" stroke-width="3" stroke-linecap="round"/>
      <text x="48" y="-5" fill="#8c98a5" font-size="12" font-weight="800" letter-spacing="1.3">PRÓXIMO · M08–M12</text>
      <text x="48" y="24" fill="#f0f6fc" font-size="22" font-weight="800">Dados e JavaScript</text>
      <text x="48" y="49" fill="#b1bac4" font-size="15">Arrays, objetos, métodos e manipulação de dados.</text>
    </g>

    <g transform="translate(102 714)">
      <circle r="24" fill="#0d2c1a" stroke="#238636" stroke-width="3" stroke-dasharray="5 5"/>
      <path d="M-8-7h16v14H-8zM-3-2h6M-3 3h6" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="-5" fill="#3fb950" font-size="12" font-weight="800" letter-spacing="1.3">DESTINO · M13+</text>
      <text x="48" y="24" fill="#f0f6fc" font-size="22" font-weight="800">Backend</text>
      <text x="48" y="49" fill="#b1bac4" font-size="15">Node.js, APIs, banco de dados e aplicações completas.</text>
    </g>
  </g>

  <g class="mobile" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="48" y="62" fill="#79c0ff" font-size="17" font-weight="800" letter-spacing="2">TRILHA DE APRENDIZADO</text>
    <text x="48" y="112" fill="#f0f6fc" font-size="42" font-weight="800">Rumo ao Backend.</text>
    <text x="48" y="145" fill="#d0d7de" font-size="20">Uma etapa prática de cada vez.</text>

    <path d="M91 208V727" stroke="#30363d" stroke-width="5" stroke-linecap="round"/>
    <path d="M91 208V400" stroke="#2f81f7" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(91 220)">
      <circle r="27" fill="#0d2c1a" stroke="#3fb950" stroke-width="4"/>
      <path d="m-10 0 7 8L12-9" fill="none" stroke="#56d364" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="-2" fill="#56d364" font-size="18" font-weight="800">M01–M05 · CONCLUÍDO</text>
      <text x="51" y="30" fill="#f0f6fc" font-size="28" font-weight="800">Fundamentos</text>
      <text x="51" y="58" fill="#d0d7de" font-size="20">Lógica e entrada de dados.</text>
    </g>

    <g transform="translate(91 346)">
      <circle r="27" fill="#102a4c" stroke="#2f81f7" stroke-width="4"/>
      <path d="M-10 0A11 11 0 1 1 0 10" fill="none" stroke="#79c0ff" stroke-width="4" stroke-linecap="round"/>
      <path d="m-2 5 3 7-8 1" fill="#79c0ff"/>
      <text x="51" y="-2" fill="#79c0ff" font-size="18" font-weight="800">M06 · REVISÃO</text>
      <text x="51" y="30" fill="#f0f6fc" font-size="28" font-weight="800">Controle de fluxo</text>
      <text x="51" y="58" fill="#d0d7de" font-size="20">Laços de repetição.</text>
    </g>

    <g transform="translate(48 430)">
      <rect width="624" height="132" rx="18" fill="#201c08" stroke="#f2cc60" stroke-width="3"/>
      <text x="22" y="35" fill="#f2cc60" font-size="18" font-weight="800">FOCO ATUAL · 64%</text>
      <text x="22" y="78" fill="#f0f6fc" font-size="34" font-weight="800">M07 · Funções</text>
      <text x="22" y="109" fill="#f6e8a6" font-size="21">Parâmetros, retorno e escopo.</text>
    </g>

    <g transform="translate(91 638)">
      <circle r="27" fill="#161b22" stroke="#484f58" stroke-width="4"/>
      <path d="M-9 1h18M0-8v18" stroke="#b1bac4" stroke-width="4" stroke-linecap="round"/>
      <text x="51" y="-2" fill="#b1bac4" font-size="18" font-weight="800">M08–M12 · PRÓXIMO</text>
      <text x="51" y="30" fill="#f0f6fc" font-size="28" font-weight="800">Dados e JavaScript</text>
    </g>

    <g transform="translate(91 738)">
      <circle r="27" fill="#0d2c1a" stroke="#238636" stroke-width="4" stroke-dasharray="6 6"/>
      <path d="M-9-8h18V8H-9zM-3-2h6M-3 4h6" fill="none" stroke="#56d364" stroke-width="3" stroke-linecap="round"/>
      <text x="51" y="-2" fill="#56d364" font-size="18" font-weight="800">M13+ · DESTINO</text>
      <text x="51" y="30" fill="#f0f6fc" font-size="28" font-weight="800">Backend</text>
    </g>
  </g>
</svg>
