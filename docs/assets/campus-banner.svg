<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Campus Backend — JavaScript como base. Backend como destino.">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#1f6feb"/>
      <stop offset="70%" style="stop-color:#388bfd"/>
      <stop offset="100%" style="stop-color:#388bfd;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7df1e"/>
      <stop offset="100%" style="stop-color:#ca8a04"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#339933"/>
      <stop offset="100%" style="stop-color:#1a5c1a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e6edf3"/>
      <stop offset="60%" style="stop-color:#79c0ff"/>
      <stop offset="100%" style="stop-color:#388bfd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#21262d" opacity="0.8"/>
    </pattern>
    <style>
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      @keyframes slide { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
      @keyframes blink { 0%,100%{opacity:1} 49%{opacity:1} 50%{opacity:0} 99%{opacity:0} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes scan { 0%{transform:translateY(-10px);opacity:0} 50%{opacity:0.6} 100%{transform:translateY(310px);opacity:0} }
      .mono { font-family: 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .cursor { animation: blink 1.1s step-start infinite; }
      .float { animation: float 3.2s ease-in-out infinite; }
      .scanner { animation: scan 4s ease-in-out infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .slide { animation: slide 2.2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="200" rx="180" ry="120" fill="#1f6feb" opacity="0.04"/>
  <ellipse cx="1000" cy="200" rx="160" ry="110" fill="#388bfd" opacity="0.05"/>
  <ellipse cx="600" cy="380" rx="200" ry="80" fill="#f7df1e" opacity="0.025"/>

  <!-- Top border line animated -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#lineGrad)" opacity="0.7"/>

  <!-- Scan line effect -->
  <rect width="1200" height="1.5" fill="#388bfd" opacity="0.12" class="scanner"/>

  <!-- LEFT: Terminal window -->
  <g transform="translate(48,48)">
    <!-- Window chrome -->
    <rect width="480" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect width="480" height="36" rx="10" fill="#1c2128"/>
    <rect x="0" y="26" width="480" height="10" fill="#1c2128"/>
    <rect x="0" y="36" width="480" height="1" fill="#30363d"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>

    <!-- Tab title -->
    <text x="240" y="23" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">campus-backend — bash</text>

    <!-- Terminal content -->
    <text x="18" y="70" class="mono" font-size="13" fill="#3fb950">carlos@campus</text>
    <text x="130" y="70" class="mono" font-size="13" fill="#8b949e"> in </text>
    <text x="153" y="70" class="mono" font-size="13" fill="#79c0ff">~/Pratica_Back-End_Senai</text>

    <text x="18" y="93" class="mono" font-size="13" fill="#3fb950">❯</text>
    <text x="30" y="93" class="mono" font-size="13" fill="#e6edf3">npm run dev</text>

    <text x="18" y="116" class="mono" font-size="11.5" fill="#8b949e">▲ Next.js 15.4.6</text>
    <text x="18" y="133" class="mono" font-size="11.5" fill="#8b949e">- Local:   </text>
    <text x="100" y="133" class="mono" font-size="11.5" fill="#79c0ff">http://localhost:3000</text>

    <text x="18" y="155" class="mono" font-size="11.5" fill="#3fb950">✓</text>
    <text x="28" y="155" class="mono" font-size="11.5" fill="#8b949e"> Starting...</text>

    <!-- Blinking bar separator -->
    <rect x="18" y="165" width="444" height="1" fill="#21262d"/>

    <!-- Code lines animated -->
    <text x="18" y="185" class="mono" font-size="11.5" fill="#8b949e">  Módulos concluídos </text>
    <text x="168" y="185" class="mono" font-size="11.5" fill="#f7df1e">M01 → M06</text>
    <text x="18" y="202" class="mono" font-size="11.5" fill="#8b949e">  Foco atual        </text>
    <text x="138" y="202" class="mono" font-size="11.5" fill="#3fb950">M07 — Funções</text>
    <text x="18" y="219" class="mono" font-size="11.5" fill="#8b949e">  Exercícios ativos  </text>
    <text x="148" y="219" class="mono" font-size="11.5" fill="#79c0ff">69 arquivos .js</text>
    <text x="18" y="236" class="mono" font-size="11.5" fill="#8b949e">  Build status       </text>
    <text x="138" y="236" class="mono" font-size="11.5" fill="#3fb950">✓ passing</text>

    <rect x="18" y="246" width="444" height="1" fill="#21262d"/>

    <text x="18" y="265" class="mono" font-size="13" fill="#3fb950">❯</text>
    <text x="30" y="265" class="mono" font-size="13" fill="#e6edf3">_</text>
    <rect x="30" y="253" width="9" height="16" fill="#e6edf3" class="cursor" opacity="0.9"/>

    <!-- Status badge -->
    <rect x="360" y="274" width="102" height="22" rx="4" fill="#1a3a1a" stroke="#3fb950" stroke-width="1"/>
    <circle cx="373" cy="285" r="4" fill="#3fb950" class="pulse"/>
    <text x="382" y="289" class="mono" font-size="10" font-weight="700" fill="#3fb950">LIVE · dev mode</text>
  </g>

  <!-- CENTER: Hero text -->
  <g transform="translate(580,80)">
    <!-- Eyebrow label -->
    <rect x="0" y="0" width="186" height="24" rx="4" fill="#1f2d3d" stroke="#1f6feb" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#1f6feb" class="pulse"/>
    <text x="24" y="16" class="mono" font-size="11" font-weight="700" fill="#79c0ff" letter-spacing="1">PROJETO · OPEN LEARNING</text>

    <!-- Main heading -->
    <text x="0" y="62" class="sans" font-size="44" font-weight="800" fill="url(#textGrad)">Campus</text>
    <text x="0" y="110" class="sans" font-size="44" font-weight="800" fill="url(#textGrad)">Backend</text>

    <!-- Subheading -->
    <text x="0" y="140" class="mono" font-size="15" fill="#f7df1e">JavaScript como base.</text>
    <text x="0" y="162" class="mono" font-size="15" fill="#8b949e">Backend como destino.</text>

    <!-- Divider line -->
    <rect x="0" y="178" width="72" height="2" rx="1" fill="#1f6feb"/>

    <!-- Description -->
    <text x="0" y="206" class="sans" font-size="13" fill="#8b949e">Plataforma educacional com sala de aula,</text>
    <text x="0" y="222" class="sans" font-size="13" fill="#8b949e">laboratório Monaco e arena de desafios.</text>

    <!-- Stack pills -->
    <g transform="translate(0, 244)">
      <rect width="74" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="37" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#f7df1e">JS ES2024</text>
    </g>
    <g transform="translate(82, 244)">
      <rect width="74" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="37" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#e6edf3">Next.js 15</text>
    </g>
    <g transform="translate(164, 244)">
      <rect width="66" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="33" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#3fb950">Node.js</text>
    </g>
    <g transform="translate(238, 244)">
      <rect width="72" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="36" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#79c0ff">TypeScript</text>
    </g>

    <!-- Author -->
    <text x="0" y="306" class="mono" font-size="11" fill="#484f58">por Carlos Alexandre · SENAI Dr. Celso Charuri</text>
  </g>

  <!-- RIGHT: Stats column -->
  <g transform="translate(1030,72)">
    <!-- Stat card 1 -->
    <rect width="128" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="64" y="24" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Módulos</text>
    <text x="64" y="50" text-anchor="middle" class="sans" font-size="28" font-weight="800" fill="#e6edf3">12</text>
    <text x="64" y="64" text-anchor="middle" class="mono" font-size="9" fill="#3fb950">concluídos</text>

    <!-- Stat card 2 -->
    <rect y="84" width="128" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="64" y="108" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Exercícios</text>
    <text x="64" y="134" text-anchor="middle" class="sans" font-size="28" font-weight="800" fill="#e6edf3">69</text>
    <text x="64" y="148" text-anchor="middle" class="mono" font-size="9" fill="#79c0ff">arquivos .js</text>

    <!-- Stat card 3 -->
    <rect y="168" width="128" height="70" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
    <text x="64" y="192" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Foco atual</text>
    <text x="64" y="218" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#f7df1e">M07</text>
    <text x="64" y="232" text-anchor="middle" class="mono" font-size="9" fill="#f7df1e">Funções</text>

    <!-- Stat card 4 -->
    <rect y="252" width="128" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="64" y="276" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">Build</text>
    <text x="64" y="302" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#3fb950">✓ passing</text>
    <text x="64" y="316" text-anchor="middle" class="mono" font-size="9" fill="#8b949e">npm run build</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="399" width="1200" height="1" fill="url(#lineGrad)" opacity="0.7"/>
</svg>
