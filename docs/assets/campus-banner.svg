<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Campus Backend</title>
  <desc id="desc">Projeto educacional de JavaScript Backend com cinco módulos concluídos, 69 exercícios e foco atual no módulo 7, Funções.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a27"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#243044" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>
  <style>
    .mobile { display: none; }
    @media (max-width: 480px) {
      .desktop { display: none; }
      .mobile { display: inline; }
    }
  </style>

  <rect width="720" height="400" rx="24" fill="url(#bg)"/>
  <rect width="720" height="400" rx="24" fill="url(#grid)"/>
  <path d="M0 0H720V6H0Z" fill="#2f81f7"/>
  <circle cx="643" cy="84" r="126" fill="#2f81f7" opacity=".06"/>
  <circle cx="680" cy="54" r="68" fill="#79c0ff" opacity=".05"/>

  <g class="desktop" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="48" y="44" width="196" height="30" rx="15" fill="#16355f" stroke="#2f81f7"/>
    <circle cx="64" cy="59" r="4" fill="#79c0ff"/>
    <text x="77" y="64" fill="#cae8ff" font-size="12" font-weight="700" letter-spacing="1.5">PROJETO EDUCACIONAL</text>

    <text x="48" y="132" fill="#f0f6fc" font-size="52" font-weight="800" letter-spacing="-1.6">Campus Backend</text>
    <text x="48" y="173" fill="#f2cc60" font-size="22" font-weight="700">JavaScript como base. Backend como destino.</text>
    <text x="48" y="211" fill="#b1bac4" font-size="17">Uma trilha prática para aprender construindo,</text>
    <text x="48" y="235" fill="#b1bac4" font-size="17">testando e documentando cada etapa.</text>

    <g font-family="Cascadia Code,Consolas,monospace" font-size="12" font-weight="700">
      <rect x="48" y="258" width="92" height="30" rx="8" fill="#251f05" stroke="#9e8200"/>
      <text x="66" y="278" fill="#f2cc60">JavaScript</text>
      <rect x="150" y="258" width="75" height="30" rx="8" fill="#0d2c1a" stroke="#238636"/>
      <text x="168" y="278" fill="#56d364">Node.js</text>
      <rect x="235" y="258" width="70" height="30" rx="8" fill="#102a4c" stroke="#2f81f7"/>
      <text x="253" y="278" fill="#79c0ff">APIs</text>
    </g>

    <g transform="translate(48 316)">
      <rect width="188" height="60" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="25" fill="#f0f6fc" font-size="22" font-weight="800">5</text>
      <text x="18" y="44" fill="#8c98a5" font-size="12" font-weight="600">módulos concluídos</text>

      <rect x="202" width="188" height="60" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="220" y="25" fill="#f0f6fc" font-size="22" font-weight="800">69</text>
      <text x="220" y="44" fill="#8c98a5" font-size="12" font-weight="600">exercícios práticos</text>

      <rect x="404" width="220" height="60" rx="12" fill="#102a4c" stroke="#2f81f7"/>
      <text x="422" y="25" fill="#79c0ff" font-size="22" font-weight="800">M07</text>
      <text x="422" y="44" fill="#cae8ff" font-size="12" font-weight="600">foco atual · Funções</text>
    </g>
  </g>

  <g class="mobile" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="48" y="38" width="244" height="38" rx="19" fill="#16355f" stroke="#2f81f7"/>
    <circle cx="69" cy="57" r="5" fill="#79c0ff"/>
    <text x="85" y="63" fill="#cae8ff" font-size="16" font-weight="800" letter-spacing="1.6">PROJETO EDUCACIONAL</text>

    <text x="48" y="142" fill="#f0f6fc" font-size="58" font-weight="800" letter-spacing="-1.6">Campus Backend</text>
    <text x="48" y="188" fill="#f2cc60" font-size="26" font-weight="800">JavaScript → Backend</text>
    <text x="48" y="228" fill="#d0d7de" font-size="21">Aprenda construindo, testando</text>
    <text x="48" y="257" fill="#d0d7de" font-size="21">e documentando cada etapa.</text>

    <g transform="translate(48 296)">
      <rect width="188" height="66" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="30" fill="#f0f6fc" font-size="28" font-weight="800">5</text>
      <text x="18" y="53" fill="#b1bac4" font-size="17" font-weight="600">módulos concluídos</text>

      <rect x="202" width="188" height="66" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="220" y="30" fill="#f0f6fc" font-size="28" font-weight="800">69</text>
      <text x="220" y="53" fill="#b1bac4" font-size="17" font-weight="600">exercícios</text>

      <rect x="404" width="220" height="66" rx="12" fill="#102a4c" stroke="#2f81f7"/>
      <text x="422" y="30" fill="#79c0ff" font-size="28" font-weight="800">M07</text>
      <text x="422" y="53" fill="#cae8ff" font-size="17" font-weight="600">Funções · foco atual</text>
    </g>
  </g>
</svg>
