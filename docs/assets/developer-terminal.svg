    <style>
      @keyframes blink { 0%,100%{opacity:1} 49%{opacity:1} 50%{opacity:0} 99%{opacity:0} }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      @keyframes typeIn { 0%{opacity:0} 100%{opacity:1} }
      @keyframes progressFill { 0%{width:0} 100%{width:var(--w)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes scan { 0%{transform:translateY(0);opacity:0.4} 100%{transform:translateY(350px);opacity:0} }
      .mono { font-family: 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .cursor { animation: blink 1.1s step-start infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      .scanner { animation: scan 5s linear infinite; }
    </style>
