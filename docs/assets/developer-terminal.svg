<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Carlos Alexandre — Developer Profile">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb"/>
      <stop offset="100%" style="stop-color:#388bfd;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="cardLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#1c2128"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6feb"/>
      <stop offset="50%" style="stop-color:#388bfd"/>
      <stop offset="100%" style="stop-color:#1158c7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#21262d" opacity="0.8"/>
    </pattern>
    <clipPath id="avatarClip">
      <circle cx="60" cy="60" r="52"/>
    </clipPath>
    <style>
      @keyframes blink { 0%,100%{opacity:1} 49%{opacity:1} 50%{opacity:0} 99%{opacity:0} }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      @keyframes typeIn { 0%{opacity:0} 100%{opacity:1} }
      @keyframes progressFill { 0%{width:0} 100%{width:var(--w)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes scan { 0%{transform:translateY(0);opacity:0.4} 100%{transform:translateY(350px);opacity:0} }
      .mono { font-family: 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .cursor { animation: blink 1.1s step-start infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      .scanner { animation: scan 5s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="470" fill="url(#bg)"/>
  <rect width="1200" height="470" fill="url(#dots)" opacity="0.5"/>

  <!-- Scan line -->
  <rect width="1200" height="1" fill="#388bfd" opacity="0.08" class="scanner"/>

  <!-- Ambient glow -->
  <ellipse cx="150" cy="220" rx="140" ry="100" fill="#1f6feb" opacity="0.05"/>
  <ellipse cx="900" cy="220" rx="200" ry="120" fill="#1f6feb" opacity="0.04"/>

  <!-- Top border -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#accentLine)" opacity="0.8"/>

  <!-- === LEFT PANEL: Terminal === -->
  <g transform="translate(48,44)">
    <rect width="480" height="412" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>

    <!-- Window chrome -->
    <rect width="480" height="36" rx="10" fill="#1c2128"/>
    <rect x="0" y="26" width="480" height="10" fill="#1c2128"/>
    <rect x="0" y="36" width="480" height="1" fill="#30363d"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>
    <text x="240" y="23" text-anchor="middle" class="mono" font-size="15" fill="#a5b3c2">carlos@campus — ~</text>

    <!-- Terminal session -->
    <text x="18" y="64" class="mono" font-size="16" fill="#3fb950">carlos@campus</text>
    <text x="140" y="64" class="mono" font-size="16" fill="#a5b3c2"> ~ $</text>
    <text x="171" y="64" class="mono" font-size="16" font-weight="700" fill="#f0f6fc">whoami</text>

    <text x="18" y="87" class="mono" font-size="15" fill="#c9d1d9">Carlos Alexandre Duarte Pereira</text>
    <text x="18" y="105" class="mono" font-size="15" fill="#a5b3c2">Backend Developer em formação</text>

    <rect x="18" y="124" width="444" height="1" fill="#21262d"/>

    <text x="18" y="132" class="mono" font-size="16" fill="#3fb950">carlos@campus</text>
    <text x="140" y="132" class="mono" font-size="16" fill="#a5b3c2"> ~ $</text>
    <text x="171" y="132" class="mono" font-size="16" font-weight="700" fill="#f0f6fc">cat mission.json</text>

    <!-- JSON output -->
    <text x="18" y="156" class="mono" font-size="15" fill="#768390">{</text>
    <text x="30" y="173" class="mono" font-size="15" font-weight="700" fill="#79c0ff">  "role"</text>
    <text x="94" y="173" class="mono" font-size="15" fill="#e6edf3">: </text>
    <text x="108" y="173" class="mono" font-size="15" fill="#a5d6ff">"Backend Developer em formação"</text>
    <text x="30" y="190" class="mono" font-size="15" font-weight="700" fill="#79c0ff">  "school"</text>
    <text x="106" y="190" class="mono" font-size="15" fill="#e6edf3">: </text>
    <text x="120" y="190" class="mono" font-size="15" fill="#a5d6ff">"SENAI Dr. Celso Charuri"</text>
    <text x="30" y="207" class="mono" font-size="15" font-weight="700" fill="#79c0ff">  "focus"</text>
    <text x="96" y="207" class="mono" font-size="15" fill="#e6edf3">: </text>
    <text x="110" y="207" class="mono" font-size="15" fill="#f7df1e">"JavaScript → Node.js → APIs"</text>
    <text x="30" y="224" class="mono" font-size="15" font-weight="700" fill="#79c0ff">  "status"</text>
    <text x="104" y="224" class="mono" font-size="15" fill="#e6edf3">: </text>
    <text x="118" y="224" class="mono" font-size="15" fill="#3fb950">"building in public"</text>
    <text x="30" y="241" class="mono" font-size="15" font-weight="700" fill="#79c0ff">  "module"</text>
    <text x="104" y="241" class="mono" font-size="15" fill="#e6edf3">: </text>
    <text x="118" y="241" class="mono" font-size="15" fill="#f7df1e">"M07 — Funções"</text>
    <text x="18" y="258" class="mono" font-size="15" fill="#768390">}</text>

    <rect x="18" y="268" width="444" height="1" fill="#21262d"/>

    <!-- Next command -->
    <text x="18" y="290" class="mono" font-size="16" fill="#3fb950">carlos@campus</text>
    <text x="140" y="290" class="mono" font-size="16" fill="#a5b3c2"> ~ $</text>
    <text x="171" y="290" class="mono" font-size="16" font-weight="700" fill="#f0f6fc">git log --oneline -3</text>

    <rect x="18" y="302" width="54" height="20" rx="4" fill="#1a2d4a" stroke="#1f6feb"/>
    <text x="45" y="317" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#79c0ff">DOCS</text>
    <text x="82" y="317" class="mono" font-size="15" fill="#e6edf3">README profissional</text>
    <rect x="18" y="326" width="54" height="20" rx="4" fill="#2d2a00" stroke="#ca8a04"/>
    <text x="45" y="341" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#f7df1e">M07</text>
    <text x="82" y="341" class="mono" font-size="15" fill="#e6edf3">arena de desafios</text>
    <rect x="18" y="350" width="54" height="20" rx="4" fill="#0d2818" stroke="#238636"/>
    <text x="45" y="365" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3fb950">LAB</text>
    <text x="82" y="365" class="mono" font-size="15" fill="#e6edf3">laboratório Monaco</text>

    <rect x="18" y="382" width="12" height="18" fill="#e6edf3" class="cursor" opacity="0.9"/>
  </g>

  <!-- === RIGHT PANEL: Profile Card === -->
  <g transform="translate(568,44)">
    <rect width="588" height="412" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#shadow)"/>

    <!-- Profile header -->
    <rect width="588" height="88" rx="10" fill="#1c2128"/>
    <rect x="0" y="78" width="588" height="10" fill="#1c2128"/>
    <rect x="0" y="88" width="588" height="1" fill="#30363d"/>

    <!-- Accent strip -->
    <rect width="588" height="4" rx="2" fill="url(#accentLine)" opacity="0.9"/>

    <!-- Avatar circle -->
    <circle cx="60" cy="60" r="42" fill="url(#avatarGrad)"/>
    <!-- Avatar initials -->
    <text x="60" y="55" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#fff">CA</text>
    <text x="60" y="73" text-anchor="middle" class="mono" font-size="11" fill="#a5d6ff">dev</text>
    <!-- Status dot -->
    <circle cx="94" cy="92" r="7" fill="#161b22"/>
    <circle cx="94" cy="92" r="5" fill="#3fb950" class="pulse"/>

    <!-- Name and title -->
    <text x="120" y="45" class="sans" font-size="22" font-weight="750" fill="#f0f6fc">Carlos Alexandre Duarte Pereira</text>
    <text x="120" y="65" class="mono" font-size="15" fill="#a5b3c2">@carloska24 · Backend Developer em formação</text>

    <!-- Badges -->
    <g transform="translate(120, 72)">
      <rect width="110" height="18" rx="4" fill="#1a2d4a"/>
      <circle cx="9" cy="9" r="4" fill="#1f6feb"/>
      <text x="18" y="13" class="mono" font-size="12" font-weight="700" fill="#79c0ff">SENAI Charuri</text>
    </g>
    <g transform="translate(238, 72)">
      <rect width="82" height="18" rx="4" fill="#0d2818"/>
      <circle cx="9" cy="9" r="4" fill="#3fb950" class="pulse"/>
      <text x="18" y="13" class="mono" font-size="12" font-weight="700" fill="#3fb950">Open Source</text>
    </g>

    <!-- Body content -->
    <g transform="translate(18,108)">

      <!-- About -->
      <text x="0" y="18" class="mono" font-size="14" font-weight="700" fill="#a5b3c2" letter-spacing="1">SOBRE</text>
      <text x="0" y="42" class="sans" font-size="16" fill="#f0f6fc">Construindo um campus de estudos aberto enquanto</text>
      <text x="0" y="62" class="sans" font-size="16" fill="#f0f6fc">me preparo para o curso de Backend do SENAI. Aprendo</text>
      <text x="0" y="82" class="sans" font-size="16" fill="#f0f6fc">fazendo, compartilho documentando.</text>

      <rect x="0" y="94" width="550" height="1" fill="#21262d"/>

      <!-- Learning pipeline -->
      <text x="0" y="116" class="mono" font-size="14" font-weight="700" fill="#a5b3c2" letter-spacing="1">LEARNING PIPELINE</text>

      <!-- JS pill -->
      <rect x="0" y="124" width="80" height="26" rx="4" fill="#2d2a00" stroke="#f7df1e" stroke-width="1.5"/>
      <text x="40" y="143" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#f7df1e">JavaScript</text>

      <!-- Arrow -->
      <text x="86" y="144" class="mono" font-size="14" fill="#768390">→</text>

      <!-- Node pill -->
      <rect x="100" y="124" width="68" height="26" rx="4" fill="#0d2818" stroke="#238636" stroke-width="1.5"/>
      <text x="134" y="143" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#3fb950">Node.js</text>

      <!-- Arrow -->
      <text x="174" y="144" class="mono" font-size="14" fill="#768390">→</text>

      <!-- API pill -->
      <rect x="188" y="124" width="56" height="26" rx="4" fill="#1a2040" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="216" y="143" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#79c0ff">APIs</text>

      <rect x="0" y="164" width="550" height="1" fill="#21262d"/>

      <!-- Skills with progress bars -->
      <text x="0" y="186" class="mono" font-size="14" font-weight="700" fill="#a5b3c2" letter-spacing="1">HABILIDADES EM CONSTRUÇÃO</text>

      <!-- Skill 1: JS Fundamentos -->
      <text x="0" y="210" class="mono" font-size="16" font-weight="600" fill="#f0f6fc">JavaScript Fundamentos</text>
      <text x="310" y="210" class="mono" font-size="14" fill="#3fb950" font-weight="700">80% · M01–M06 ✓</text>
      <rect x="0" y="218" width="296" height="8" rx="4" fill="#21262d"/>
      <rect x="0" y="218" width="236" height="8" rx="4" fill="#388bfd"/>

      <!-- Skill 2: Funções -->
      <text x="0" y="247" class="mono" font-size="16" font-weight="600" fill="#f0f6fc">Funções &amp; Composição</text>
      <text x="310" y="247" class="mono" font-size="14" fill="#f7df1e" font-weight="700">34% · M07 ATUAL</text>
      <rect x="0" y="255" width="296" height="8" rx="4" fill="#21262d"/>
      <rect x="0" y="255" width="100" height="8" rx="4" fill="#ca8a04"/>

      <!-- Skill 3: Node.js -->
      <text x="0" y="284" class="mono" font-size="16" font-weight="600" fill="#c9d1d9">Node.js &amp; APIs</text>
      <text x="310" y="284" class="mono" font-size="14" fill="#c9d1d9" font-weight="700">PLANEJADO · M13+</text>
      <rect x="0" y="292" width="296" height="8" rx="4" fill="#21262d"/>

    </g>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="469" width="1200" height="1" fill="url(#accentLine)" opacity="0.8"/>
</svg>
