<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img" aria-labelledby="title desc">
  <title id="title">Mapa da campanha do Campus Backend</title>
  <desc id="desc">Trilha de fundamentos e decisões, repetição e padrões, funções, dados e JavaScript moderno até Node.js e APIs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect width="1160" height="330" rx="22" fill="url(#bg)"/>
  <text x="42" y="45" class="mono" font-size="13" font-weight="800" fill="#38bdf8">CAMPAIGN MAP / JAVASCRIPT BACKEND</text>
  <text x="42" y="77" class="sans" font-size="24" font-weight="900" fill="#f8fafc">Cada módulo transforma conceito em habilidade.</text>
  <text x="42" y="102" class="sans" font-size="14" fill="#94a3b8">O avanço acontece por domínio e prática, não apenas por cliques.</text>

  <path d="M100 198H1052" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 198H576" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="44;0" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(100 198)">
    <circle r="25" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
    <text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="900" fill="#eff6ff">01</text>
    <text y="52" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#7dd3fc">M01–M02</text>
    <text y="75" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#e2e8f0">Fundamentos</text>
    <text y="94" text-anchor="middle" class="sans" font-size="12" fill="#94a3b8">e decisões</text>
  </g>
  <g transform="translate(326 198)">
    <circle r="25" fill="#0369a1" stroke="#7dd3fc" stroke-width="3"/>
    <text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="900" fill="#eff6ff">02</text>
    <text y="52" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#7dd3fc">M03–M06</text>
    <text y="75" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#e2e8f0">Repetição</text>
    <text y="94" text-anchor="middle" class="sans" font-size="12" fill="#94a3b8">e padrões</text>
  </g>
  <g transform="translate(552 198)">
    <circle r="34" fill="#f7df1e" stroke="#fde68a" stroke-width="4">
      <animate attributeName="r" values="31;35;31" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" class="mono" font-size="13" font-weight="900" fill="#111827">M07</text>
    <rect x="-36" y="-63" width="72" height="23" rx="5" fill="#422006"/>
    <text y="-47" text-anchor="middle" class="mono" font-size="10" font-weight="900" fill="#fde68a">FOCO ATUAL</text>
    <text y="57" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#fde047">FUNÇÕES</text>
    <text y="80" text-anchor="middle" class="sans" font-size="12" fill="#94a3b8">entrada → retorno</text>
  </g>
  <g transform="translate(778 198)">
    <circle r="25" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="900" fill="#dbeafe">04</text>
    <text y="52" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#93c5fd">M08–M12</text>
    <text y="75" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#e2e8f0">Dados e JS</text>
    <text y="94" text-anchor="middle" class="sans" font-size="12" fill="#94a3b8">moderno</text>
  </g>
  <g transform="translate(1030 198)">
    <circle r="29" fill="#071b16" stroke="#22c55e" stroke-width="3"/>
    <path d="M-10-8h20M-10 0h20M-10 8h20" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
    <text y="57" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#86efac">NEXT QUEST</text>
    <text y="80" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#e2e8f0">Node.js + APIs</text>
  </g>
</svg>
