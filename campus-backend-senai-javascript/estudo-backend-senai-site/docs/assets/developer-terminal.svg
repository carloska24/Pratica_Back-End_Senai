<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">Carlos Backend Knowledge Factory</title>
  <desc id="desc">Carlos carrega um bloco JavaScript para uma linha de montagem que transforma estudo em prática Backend e compartilha o resultado em um campus aberto.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="machine" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#93c5fd" stroke-opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 12px; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1160" height="620" rx="30" fill="url(#page)"/>
  <rect width="1160" height="620" rx="30" fill="url(#grid)"/>

  <g transform="translate(54 34)">
    <rect width="1052" height="576" rx="22" fill="url(#terminal)" stroke="#1e3a5f" filter="url(#shadow)"/>
    <rect width="1052" height="58" rx="22" fill="#0b1424"/>
    <path d="M0 58h1052" stroke="#23334b"/>
    <circle cx="28" cy="29" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="29" r="7" fill="#febc2e"/>
    <circle cx="76" cy="29" r="7" fill="#28c840"/>
    <text x="106" y="35" class="mono" font-size="14" fill="#94a3b8">campus-backend / knowledge-factory.svg</text>
    <circle cx="944" cy="29" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="960" y="34" class="mono label" fill="#86efac">BUILDING</text>

    <g transform="translate(34 86)">
      <text x="0" y="0" class="mono" font-size="14" font-weight="800" fill="#38bdf8">BUILD LOG 001</text>
      <text x="0" y="34" class="sans" font-size="29" font-weight="900" fill="#f8fafc">Transformando estudo em Backend.</text>
      <text x="0" y="62" class="sans" font-size="15" fill="#aebdd0">Uma peça por vez. Com prática, documentação e código aberto.</text>
    </g>

    <!-- Knowledge factory scene -->
    <g transform="translate(30 188)">
      <rect width="634" height="314" rx="18" fill="#0a1322" stroke="#26364c"/>
      <text x="22" y="30" class="mono label" fill="#64748b">FACTORY FLOOR / LEARNING IN PROGRESS</text>

      <!-- Student builder carrying the current JavaScript block -->
      <g transform="translate(36 62)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" repeatCount="indefinite"/>
          <circle cx="70" cy="55" r="26" fill="#dbeafe" stroke="#38bdf8" stroke-width="3"/>
          <path d="M46 53c7-31 43-36 53-8-17-6-26 7-39 5-6-1-9 0-14 3Z" fill="#334155"/>
          <circle cx="61" cy="57" r="3" fill="#0f172a"/>
          <circle cx="80" cy="57" r="3" fill="#0f172a"/>
          <path d="M62 69c7 5 13 5 20 0" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
          <path d="M49 93h43l12 65H37Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
          <path d="M48 105 18 83M92 105l31-22" fill="none" stroke="#dbeafe" stroke-width="9" stroke-linecap="round"/>
          <path d="M50 157 38 204M88 157l18 47" fill="none" stroke="#60a5fa" stroke-width="11" stroke-linecap="round"/>
          <path d="M24 82h94" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
          <rect x="27" y="12" width="86" height="64" rx="8" fill="#f7df1e" stroke="#ca8a04" stroke-width="3" filter="url(#softGlow)"/>
          <text x="70" y="42" text-anchor="middle" class="mono" font-size="22" font-weight="900" fill="#111827">JS</text>
          <text x="70" y="61" text-anchor="middle" class="mono label" fill="#422006">CURRENT</text>
        </g>
        <text x="70" y="230" text-anchor="middle" class="mono label" fill="#7dd3fc">CARLOS</text>
        <text x="70" y="248" text-anchor="middle" class="mono" font-size="12" fill="#64748b">student / builder</text>
      </g>

      <!-- Conveyor: concepts become projects -->
      <g transform="translate(164 176)">
        <rect width="276" height="58" rx="11" fill="#111827" stroke="#475569"/>
        <path d="M18 15h240M18 43h240" stroke="#334155" stroke-width="3" stroke-dasharray="8 8">
          <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.2s" repeatCount="indefinite"/>
        </path>
        <circle cx="30" cy="29" r="12" fill="#1e293b" stroke="#64748b"/>
        <circle cx="246" cy="29" r="12" fill="#1e293b" stroke="#64748b"/>
        <g transform="translate(56 -21)">
          <rect width="62" height="44" rx="7" fill="#38bdf8"/>
          <text x="31" y="27" text-anchor="middle" class="mono label" fill="#082f49">LOGIC</text>
        </g>
        <g transform="translate(136 -21)">
          <rect width="62" height="44" rx="7" fill="#22c55e"/>
          <text x="31" y="27" text-anchor="middle" class="mono label" fill="#052e16">CODE</text>
        </g>
      </g>

      <!-- Backend compiler machine -->
      <g transform="translate(436 62)">
        <rect width="174" height="198" rx="14" fill="url(#machine)" stroke="#60a5fa" stroke-width="2"/>
        <rect x="18" y="18" width="138" height="42" rx="7" fill="#07111f" stroke="#334155"/>
        <text x="87" y="36" text-anchor="middle" class="mono label" fill="#38bdf8">BACKEND</text>
        <text x="87" y="52" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8">ASSEMBLER</text>
        <path d="M22 88h130M22 118h130M22 148h130" stroke="#334155" stroke-width="2"/>
        <circle cx="38" cy="88" r="6" fill="#facc15"/>
        <circle cx="69" cy="118" r="6" fill="#38bdf8"/>
        <circle cx="100" cy="148" r="6" fill="#22c55e"/>
        <path d="M38 88h31v30h31v30h46" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7">
          <animate attributeName="stroke-dashoffset" values="28;0" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <rect x="32" y="174" width="110" height="10" rx="5" fill="#1e293b"/>
        <rect x="32" y="174" width="66" height="10" rx="5" fill="#22c55e">
          <animate attributeName="width" values="48;96;66" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g transform="translate(176 270)">
        <text x="0" y="0" class="mono label" fill="#64748b">INPUT</text>
        <text x="52" y="0" class="mono label" fill="#fde047">ESTUDO</text>
        <text x="118" y="0" class="mono label" fill="#64748b">+</text>
        <text x="138" y="0" class="mono label" fill="#7dd3fc">PRÁTICA</text>
        <text x="209" y="0" class="mono label" fill="#64748b">+</text>
        <text x="228" y="0" class="mono label" fill="#86efac">PARTILHA</text>
      </g>
    </g>

    <!-- Identity and output terminal -->
    <g transform="translate(684 86)">
      <text x="0" y="0" class="mono" font-size="15" fill="#38bdf8">carlos@campus</text>
      <text x="126" y="0" class="mono" font-size="15" fill="#94a3b8">~ $</text>
      <text x="169" y="0" class="mono" font-size="15" font-weight="800" fill="#f8fafc">build --future</text>
      <rect x="292" y="-15" width="9" height="20" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <text x="0" y="46" class="mono label" fill="#22c55e">BUILDER</text>
      <text x="0" y="72" class="sans" font-size="20" font-weight="900" fill="#f8fafc">Carlos Alexandre</text>
      <text x="0" y="94" class="sans" font-size="15" fill="#cbd5e1">Backend Developer em formação</text>

      <rect x="0" y="122" width="338" height="76" rx="10" fill="#0a1322" stroke="#1d4ed8"/>
      <text x="16" y="145" class="mono label" fill="#60a5fa">FOUNDATION</text>
      <text x="16" y="170" class="sans" font-size="15" font-weight="700" fill="#e2e8f0">Análise e Desenvolvimento de Sistemas</text>
      <text x="16" y="188" class="mono" font-size="11" fill="#64748b">base para construir com propósito</text>

      <rect x="0" y="210" width="338" height="92" rx="10" fill="#071b16" stroke="#15803d"/>
      <text x="16" y="234" class="mono label" fill="#4ade80">CURRENT MISSION</text>
      <text x="16" y="260" class="sans" font-size="16" font-weight="800" fill="#f0fdf4">Desenvolvimento Backend</text>
      <text x="16" y="282" class="sans" font-size="13" fill="#bbf7d0">Escola SENAI "Dr. Celso Charuri"</text>

      <text x="0" y="334" class="mono label" fill="#64748b">LEARNING PIPELINE</text>
      <g transform="translate(0 350)">
        <rect width="84" height="30" rx="6" fill="#f7df1e"/>
        <text x="42" y="20" text-anchor="middle" class="mono label" fill="#111827">JAVASCRIPT</text>
        <path d="M90 15h20" stroke="#475569" stroke-width="2"/>
        <rect x="116" width="62" height="30" rx="6" fill="#10253a" stroke="#38bdf8"/>
        <text x="147" y="20" text-anchor="middle" class="mono label" fill="#7dd3fc">NODE</text>
        <path d="M184 15h20" stroke="#475569" stroke-width="2"/>
        <rect x="210" width="58" height="30" rx="6" fill="#10251b" stroke="#22c55e"/>
        <text x="239" y="20" text-anchor="middle" class="mono label" fill="#86efac">APIS</text>
        <path d="M274 15h20" stroke="#475569" stroke-width="2"/>
        <rect x="300" width="38" height="30" rx="6" fill="#211a36" stroke="#a78bfa"/>
        <text x="319" y="20" text-anchor="middle" class="mono label" fill="#c4b5fd">DB</text>
      </g>

      <rect x="0" y="404" width="338" height="86" rx="10" fill="#111827" stroke="#334155"/>
      <text x="16" y="428" class="mono label" fill="#fbbf24">OUTPUT</text>
      <text x="16" y="453" class="sans" font-size="16" font-weight="800" fill="#f8fafc">Campus aberto para aprender junto</text>
      <text x="16" y="476" class="mono" font-size="12" fill="#94a3b8">study → build → document → share</text>
      <circle cx="315" cy="431" r="7" fill="#22c55e" filter="url(#softGlow)"/>
    </g>
  </g>
</svg>
