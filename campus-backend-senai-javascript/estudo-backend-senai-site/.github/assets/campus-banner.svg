<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc">
  <title id="title">Campus Backend</title>
  <desc id="desc">Curso preparatório independente que conecta fundamentos, JavaScript e Backend por meio de estudo, prática e compartilhamento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#60a5fa" stroke-opacity=".10"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1160" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1160" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 70h1160" stroke="#26364c"/>
  <circle cx="34" cy="35" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="35" r="7" fill="#febc2e"/>
  <circle cx="82" cy="35" r="7" fill="#28c840"/>
  <text x="108" y="41" class="mono" font-size="14" fill="#94a3b8">campus-backend / open-learning</text>
  <circle cx="1048" cy="35" r="6" fill="#22c55e"/>
  <text x="1064" y="40" class="mono" font-size="12" font-weight="800" fill="#86efac">ONLINE</text>

  <g transform="translate(62 112)">
    <rect width="264" height="27" rx="5" fill="#10253a" stroke="#2563eb"/>
    <text x="132" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#7dd3fc">PROJETO DE ESTUDOS INDEPENDENTE</text>
    <text x="0" y="82" class="sans" font-size="48" font-weight="900" fill="#f8fafc">Campus Backend</text>
    <text x="0" y="120" class="sans" font-size="21" font-weight="700" fill="#facc15">JavaScript como base. Backend como direção.</text>
    <text x="0" y="157" class="sans" font-size="16" fill="#cbd5e1">Um campus preparatório para aprender, praticar e compartilhar.</text>
    <text x="0" y="191" class="mono" font-size="13" fill="#64748b">Escola SENAI "Dr. Celso Charuri" · curso paralelo e não oficial</text>
  </g>

  <g transform="translate(694 112)">
    <path d="M60 78h98M200 78h98" stroke="#475569" stroke-width="3" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <g>
      <rect width="120" height="156" rx="14" fill="#f7df1e" stroke="#facc15" stroke-width="3" filter="url(#glow)"/>
      <text x="60" y="68" text-anchor="middle" class="mono" font-size="34" font-weight="900" fill="#111827">JS</text>
      <text x="60" y="103" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#422006">FUNDAMENTOS</text>
      <text x="60" y="123" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#422006">+ LÓGICA</text>
    </g>
    <g transform="translate(140)">
      <rect width="120" height="156" rx="14" fill="#0b1f32" stroke="#38bdf8" stroke-width="3"/>
      <path d="M34 48h52M34 72h52M34 96h34" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <circle cx="88" cy="96" r="7" fill="#22c55e"/>
      <text x="60" y="130" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#7dd3fc">PRÁTICA</text>
    </g>
    <g transform="translate(280)">
      <rect width="120" height="156" rx="14" fill="#071b16" stroke="#22c55e" stroke-width="3"/>
      <rect x="25" y="31" width="70" height="25" rx="5" fill="#122e25" stroke="#22c55e"/>
      <rect x="25" y="66" width="70" height="25" rx="5" fill="#122e25" stroke="#22c55e"/>
      <rect x="25" y="101" width="70" height="25" rx="5" fill="#122e25" stroke="#22c55e"/>
      <circle cx="82" cy="43" r="4" fill="#4ade80"/>
      <circle cx="82" cy="78" r="4" fill="#4ade80"/>
      <circle cx="82" cy="113" r="4" fill="#4ade80"/>
      <text x="60" y="146" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#86efac">BACKEND</text>
    </g>
    <text x="200" y="190" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8">learn → build → document → share</text>
  </g>
</svg>
